[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-inspector"
version = "0.0.1"
description = "Umbrella repo for YouTube analysis Claude Code skills (youtube-verdict and siblings)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nishil" }]
dependencies = [
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yt-fetch = "scripts.fetch:main"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
